<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e6edf6" />
    <meta name="robots" content="noindex" />
    <title>Q-Stock · Offline</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark") document.documentElement.classList.add("dark");
          else if (t === "light") document.documentElement.classList.remove("dark");
          else if (window.matchMedia("(prefers-color-scheme: dark)").matches)
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --wb-parchment: #e6edf6;
        --wb-canvas: #ffffff;
        --wb-hairline: #d5dce8;
        --wb-ink: #1d1d1f;
        --wb-ink-muted: #7a7a7a;
        --background: var(--wb-parchment);
        --foreground: var(--wb-ink);
        --panel: var(--wb-canvas);
        --muted: var(--wb-ink-muted);
        --border: var(--wb-hairline);
        --brand: #0066cc;
        --brand-text: #0066cc;
        --brand-soft: rgba(0, 102, 204, 0.1);
        --on-brand: #ffffff;
        --radius-control: 10px;
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }
      html.dark {
        --wb-parchment: #06090f;
        --wb-canvas: #0f1520;
        --wb-hairline: #1c2433;
        --wb-ink: #edf2ff;
        --wb-ink-muted: #8b97ad;
        --background: var(--wb-parchment);
        --foreground: var(--wb-ink);
        --panel: var(--wb-canvas);
        --muted: var(--wb-ink-muted);
        --border: var(--wb-hairline);
        --brand: #2997ff;
        --brand-text: #64b5ff;
        --brand-soft: rgba(41, 151, 255, 0.16);
        --on-brand: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        font-family: var(--font-sans);
        color: var(--foreground);
        background: var(--background);
      }

      .top {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        height: 3.5rem;
        padding: 0 max(1.25rem, env(safe-area-inset-right)) 0
          max(1.25rem, env(safe-area-inset-left));
        border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
        background: color-mix(in srgb, var(--background) 88%, transparent);
        backdrop-filter: blur(14px);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        min-width: 0;
        color: inherit;
        text-decoration: none;
      }
      .mark {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        background: var(--brand);
        border-radius: 7px;
      }
      .mark svg {
        display: block;
      }
      .brand strong {
        font-size: 0.9375rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand .zh {
        margin-left: 0.35rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--muted);
      }
      .top-meta {
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        white-space: nowrap;
      }

      .stage {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-width: 40rem;
        margin: 0 auto;
        padding: 2.25rem max(1.25rem, env(safe-area-inset-right))
          max(2rem, env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
        overflow: hidden;
      }
      .stage::before {
        content: "";
        position: absolute;
        inset: -18% -8% auto;
        height: 52%;
        pointer-events: none;
        background: radial-gradient(
          closest-side at 28% 42%,
          color-mix(in srgb, var(--brand) 14%, transparent),
          transparent 100%
        );
      }

      /* Signal sits above copy as status mark — not floating on watermark. */
      .signal-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 4.25rem;
        height: 4.25rem;
        margin-bottom: 1.35rem;
        border-radius: 9999px;
        background: var(--brand-soft);
        color: var(--brand);
        animation: rise 0.55s ease both;
      }
      .signal-wrap svg {
        display: block;
        width: 2.35rem;
        height: auto;
      }

      .ghost {
        position: relative;
        margin: 0 0 1.25rem;
        user-select: none;
        font-size: clamp(3.75rem, 14vw, 6.25rem);
        font-weight: 650;
        line-height: 0.92;
        letter-spacing: -0.055em;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--brand) 40%, transparent),
          color-mix(in srgb, var(--brand-text) 10%, transparent)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: rise 0.55s ease 0.04s both;
      }

      .copy {
        position: relative;
        max-width: 30rem;
        animation: rise 0.55s ease 0.08s both;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 3.5vw, 1.8rem);
        font-weight: 650;
        letter-spacing: -0.03em;
        line-height: 1.25;
      }
      .title-zh {
        margin: 0.35rem 0 0;
        font-size: 0.9375rem;
        font-weight: 500;
        color: var(--muted);
      }
      .lede {
        margin: 0.85rem 0 0;
        font-size: 0.9375rem;
        line-height: 1.55;
        color: var(--muted);
      }
      .lede-zh {
        margin: 0.4rem 0 0;
        font-size: 0.8125rem;
        line-height: 1.5;
        color: color-mix(in srgb, var(--muted) 88%, transparent);
      }

      .actions {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 1.75rem;
        animation: rise 0.55s ease 0.14s both;
      }
      button.primary,
      a.secondary {
        appearance: none;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.12rem;
        min-height: 3rem;
        min-width: 8.5rem;
        padding: 0.55rem 1.2rem;
        border-radius: var(--radius-control);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.15;
        text-decoration: none;
        cursor: pointer;
        transition: filter 0.15s ease, background-color 0.15s ease,
          border-color 0.15s ease;
      }
      .btn-zh {
        font-size: 0.6875rem;
        font-weight: 500;
        opacity: 0.82;
      }
      button.primary {
        border: 0;
        background: var(--brand);
        color: var(--on-brand);
      }
      button.primary:hover {
        filter: brightness(1.06);
      }
      button.primary:active {
        filter: brightness(0.96);
      }
      a.secondary {
        color: var(--foreground);
        background: color-mix(in srgb, var(--panel) 72%, transparent);
        border: 1px solid var(--border);
      }
      a.secondary:hover {
        background: var(--brand-soft);
        border-color: color-mix(in srgb, var(--brand) 28%, var(--border));
      }
      button.primary:focus-visible,
      a.secondary:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      .foot {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-top: 2.1rem;
        font-size: 0.75rem;
        line-height: 1.4;
        color: var(--muted);
        animation: rise 0.55s ease 0.2s both;
      }
      .dot {
        width: 0.4rem;
        height: 0.4rem;
        flex-shrink: 0;
        border-radius: 9999px;
        background: var(--muted);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--muted) 35%, transparent);
        animation: pulse 1.9s ease-out infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--muted) 35%, transparent);
        }
        70% {
          box-shadow: 0 0 0 7px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .signal-wrap,
        .ghost,
        .copy,
        .actions,
        .foot,
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/" aria-label="Q-Stock">
        <span class="mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M2.5 11.5L5.6 7.4L7.9 9.8L13.5 3.5"
              stroke="#fff"
              stroke-width="1.6"
              stroke-linecap="square"
              stroke-linejoin="miter"
            />
            <path
              d="M10.6 3.5H13.5V6.3"
              stroke="#fff"
              stroke-width="1.6"
              stroke-linecap="square"
              stroke-linejoin="miter"
            />
          </svg>
        </span>
        <strong>Q-Stock</strong>
        <span class="zh">钱力股</span>
      </a>
      <time class="top-meta" id="clock" datetime=""></time>
    </header>

    <main class="stage" role="status" aria-live="polite">
      <div class="signal-wrap" aria-hidden="true">
        <svg viewBox="0 0 72 56" fill="none">
          <path
            d="M8 40c9.5-9.5 22-14.5 28-14.5S54.5 30.5 64 40"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            opacity="0.28"
          />
          <path
            d="M18 40c6.2-6.2 14.2-9.5 18-9.5s11.8 3.3 18 9.5"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            opacity="0.45"
          />
          <path
            d="M28 40c3.2-3.2 6.8-4.8 8-4.8s4.8 1.6 8 4.8"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            opacity="0.7"
          />
          <circle cx="36" cy="46" r="2.4" fill="currentColor" />
          <path
            d="M20 12L52 48"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <p class="ghost" aria-hidden="true">Offline</p>

      <div class="copy">
        <h1>You're offline</h1>
        <p class="title-zh">当前无法连接网络</p>
        <p class="lede">
          Quotes and account data need a network. When you're back online, you
          can continue watching, analyzing, and reviewing.
        </p>
        <p class="lede-zh">
          行情与账户需要联网。恢复后即可继续看盘、分析与复盘。
        </p>
      </div>

      <div class="actions">
        <button type="button" class="primary" id="retry">
          <span>Try again</span>
          <span class="btn-zh">重新连接</span>
        </button>
        <a class="secondary" href="/">
          <span>Home</span>
          <span class="btn-zh">回首页</span>
        </a>
      </div>

      <p class="foot">
        <span class="dot" aria-hidden="true"></span>
        <span id="status">Waiting for network… · 正在等待网络恢复</span>
      </p>
    </main>

    <script>
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            "content",
            document.documentElement.classList.contains("dark")
              ? "#06090f"
              : "#e6edf6",
          );
        }

        var statusEl = document.getElementById("status");
        var clockEl = document.getElementById("clock");
        function tickClock() {
          if (!clockEl) return;
          var d = new Date();
          var hh = String(d.getHours()).padStart(2, "0");
          var mm = String(d.getMinutes()).padStart(2, "0");
          clockEl.textContent = hh + ":" + mm;
          clockEl.setAttribute("datetime", d.toISOString());
        }
        tickClock();
        setInterval(tickClock, 30_000);

        function reload() {
          if (statusEl) {
            statusEl.textContent =
              "Back online — reloading… · 网络已恢复，正在刷新…";
          }
          location.reload();
        }
        document.getElementById("retry").addEventListener("click", function () {
          location.reload();
        });
        window.addEventListener("online", reload);
      })();
    </script>
  </body>
</html>
