name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 补齐的两道闸门：这两类问题以前只能等运行时炸 MISSING_MESSAGE，
      # 或者等用户看到英文页面上的 "symbol.pbRatio" 才发现。
      - name: i18n namespace scope
        run: npm run check:i18n

      - name: i18n key parity
        run: npm run check:i18n:keys
