# Build web + worker images and push to GHCR.
#
# Images:
#   ghcr.io/<owner>/deploy-qstock-web:<semver>
#   ghcr.io/<owner>/deploy-qstock-worker:<semver>
#
# Version: each run bumps patch of the latest web image tag (0.1.5 → 0.1.6).
# First run (no tags yet) starts at 0.1.5, or repo Variable DEPLOY_IMAGE_START_VERSION.
#
# Setup (once):
#   1. Settings → Actions → General → Workflow permissions: Read and write
#   2. Optional Variable NEXT_PUBLIC_QUOTE_WS_URL (wss://…/ws/quotes)
#   3. Optional Variable DEPLOY_IMAGE_START_VERSION (default 0.1.5)

name: Docker

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      quote_ws_url:
        description: "NEXT_PUBLIC_QUOTE_WS_URL bake-in (overrides repo variable)"
        required: false
        type: string
      version_override:
        description: "Force this version (skip auto +1), e.g. 0.1.9"
        required: false
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      image_web: ${{ steps.names.outputs.web }}
      image_worker: ${{ steps.names.outputs.worker }}
    steps:
      - name: Image names (lowercase owner)
        id: names
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "web=ghcr.io/${owner}/deploy-qstock-web" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${owner}/deploy-qstock-worker" >> "$GITHUB_OUTPUT"

      - name: Resolve next version (patch +1)
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          START: ${{ vars.DEPLOY_IMAGE_START_VERSION }}
          OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail
          start_ver="${START:-0.1.5}"

          if [ -n "${OVERRIDE:-}" ]; then
            echo "version=${OVERRIDE#v}" >> "$GITHUB_OUTPUT"
            echo "Using override version: ${OVERRIDE#v}"
            exit 0
          fi

          owner_lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          # Prefer user packages API; fall back to org.
          tags=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/users/${owner_lc}/packages/container/deploy-qstock-web/versions?per_page=100" \
            --jq '.[].metadata.container.tags[]?' 2>/dev/null || true)
          if [ -z "${tags}" ]; then
            tags=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${owner_lc}/packages/container/deploy-qstock-web/versions?per_page=100" \
              --jq '.[].metadata.container.tags[]?' 2>/dev/null || true)
          fi

          latest=$(printf '%s\n' $tags \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1 || true)

          if [ -z "${latest}" ]; then
            next="$start_ver"
            echo "No existing semver tags; starting at ${next}"
          else
            major=${latest%%.*}
            rest=${latest#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            next="${major}.${minor}.$((patch + 1))"
            echo "Latest ${latest} → next ${next}"
          fi

          echo "version=${next}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            target: runner
            image: ${{ needs.version.outputs.image_web }}
            needs_quote_ws: true
          - name: worker
            target: worker
            image: ${{ needs.version.outputs.image_worker }}
            needs_quote_ws: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve quote WS URL
        id: quote
        run: |
          url=""
          if [ "${{ matrix.needs_quote_ws }}" = "true" ]; then
            url="${{ inputs.quote_ws_url }}"
            if [ -z "$url" ]; then
              url="${{ vars.NEXT_PUBLIC_QUOTE_WS_URL }}"
            fi
            if [ -z "$url" ]; then
              echo "::warning::NEXT_PUBLIC_QUOTE_WS_URL unset; web image builds without a baked WS URL."
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.name }}) ${{ needs.version.outputs.version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.version.outputs.version }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_QUOTE_WS_URL=${{ steps.quote.outputs.url }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
