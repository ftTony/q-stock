services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qstock
      POSTGRES_PASSWORD: qstock
      POSTGRES_DB: qstock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qstock -d qstock"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_QUOTE_WS_URL: ${NEXT_PUBLIC_QUOTE_WS_URL:-ws://localhost:3001/ws/quotes}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://qstock:qstock@db:5432/qstock?schema=public
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_QUOTE_WS_URL: ${NEXT_PUBLIC_QUOTE_WS_URL:-ws://localhost:3001/ws/quotes}
    volumes:
      - sitemaps:/app/public/sitemaps
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node server.js"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://qstock:qstock@db:5432/qstock?schema=public
      SITEMAP_OUT_DIR: /app/public/sitemaps
      QUOTE_WS_PORT: "3001"
      QUOTE_WS_ENABLED: "true"
    volumes:
      - sitemaps:/app/public/sitemaps
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  sitemaps:
