schema: spec-driven

# Project context — guide OpenSpec artifacts (not discoverable from code alone).
context: |
  Product: learning-oriented research terminal (看盘 → 分析 → 模拟 → 复盘). Neutral copy; no stock tips.
  Locale: write OpenSpec artifacts (proposal, specs, design, tasks) in Simplified Chinese unless the user asks otherwise.
  Runtime: production is 1GB RAM / 1 vCPU — prefer Worker/cron/precompute; bounded caches; no request-path full scans.
  Frontend: src/**/*.{ts,tsx} soft limit 500 lines; qt-* / aw-* / wb-shell token roles; App shell sharp corners.
  Stack: Next.js app + FastAPI market facade; keep changes scoped and reversible.

rules:
  proposal:
    - State why, what changes, and explicit non-goals
    - Keep under ~500 Chinese characters for the summary section when possible; detail belongs in design/specs
  specs:
    - Requirements use SHALL; scenarios use WHEN/THEN
    - Cover empty states and failure/fallback paths for market data
  design:
    - Call out small-server impact (request path vs Worker/cache)
    - Note file splits if any touched module would exceed ~500 lines
  tasks:
    - Bite-sized, ordered, verifiable; prefer red/green checks where practical
    - Separate frontend / FastAPI / Worker tasks when the change spans them

operations:
  apply:
    guidance:
      - Do not start coding until the user has approved the change artifacts
      - Follow Superpowers TDD / task review when those skills are available
      - Respect .cursor/rules (small-server, file-size, product-ui-frontend-craft, design-tokens)
  archive:
    guidance:
      - Summarize what landed vs what was deferred before finishing
      - Sync delta specs into openspec/specs/
